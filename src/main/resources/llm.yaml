# ============================================================
#  统一 ChatClient 配置（YAML 版）
#  切换厂商：只改 llm.default 这一行，Java 代码一行不用动
#  API Key 用 ${环境变量} 占位，永远不写明文
# ============================================================

llm:
  # 默认用哪家：deepseek / qwen / zhipu / kimi
  # 约定：日常开发和演示统一用 deepseek，除非遇到特定场景（如需要推理模型、做多厂商对比）
  default: deepseek

  providers:

    # ---------- DeepSeek ----------
    # 环境变量：DEEPSEEK_API_KEY
    # 控制台：https://platform.deepseek.com
    deepseek:
      base-url: https://api.deepseek.com/v1
      model: deepseek-chat
      api-key: ${DEEPSEEK_API_KEY}
      timeout-seconds: 120

    # ---------- 通义千问（阿里云 DashScope 兼容模式）----------
    # 环境变量：DASHSCOPE_API_KEY
    # 注意：base-url 只写到 /compatible-mode/v1 为止，
    #      /chat/completions 由客户端追加，这里不要再写 /responses 或 /chat/completions。
    # 账号若是"仅免费额度"模式，qwen-plus/qwen-max 会返回 403 Free quota exhausted，
    # 此时用 qwen4-max（当前可用）。
    qwen:
      base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
      model: qwen4-max
      # 推理模型（reasoning）需要更大的输出预算，否则思考完就没 token 写正文了
      max-tokens: 2048
      api-key: ${DASHSCOPE_API_KEY}
      timeout-seconds: 120

    # ---------- 智谱 GLM ----------
    # 环境变量：ZHIPU_API_KEY
    zhipu:
      base-url: https://open.bigmodel.cn/api/paas/v4
      model: glm-4-plus
      api-key: ${ZHIPU_API_KEY}
      timeout-seconds: 120

    # ---------- 月之暗面 Kimi ----------
    # 环境变量：MOONSHOT_API_KEY
    kimi:
      base-url: https://api.moonshot.cn/v1
      model: moonshot-v1-8k
      api-key: ${MOONSHOT_API_KEY}
      timeout-seconds: 120

    # ---------- 追加新厂商：照抄下面这段，改 4 个值即可 ----------
    # doubao:
    #   base-url: https://ark.cn-beijing.volces.com/api/v3
    #   model: doubao-pro-32k
    #   api-key: ${ARK_API_KEY}
    #   timeout-seconds: 120
